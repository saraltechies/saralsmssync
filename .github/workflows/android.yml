name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Also build the signed release"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Check the permissions we promise
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          perms=$("$tools/aapt2" dump permissions app/build/outputs/apk/debug/app-debug.apk)
          echo "$perms"
          # The app notices new SMS. It must never read the inbox, send SMS or touch the call log.
          if echo "$perms" | grep -E "READ_SMS|SEND_SMS|WRITE_SMS|READ_CALL_LOG|READ_CONTACTS"; then
            echo "::error::The APK asks for a permission it promises not to use"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: saralsmssync-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    # Signed builds only on version tags or when explicitly requested, and never for forks (no secrets there).
    if: github.repository == 'saraltechies/saralsmssync' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.SARALSS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SARALSS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SARALSS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SARALSS_KEY_PASSWORD }}
        run: |
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          echo "$KEYSTORE_BASE64" | base64 -d > "$dir/upload-keystore.jks"
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$dir/keystore.properties"
          echo "SARALSS_KEYSTORE_PROPERTIES=$dir/keystore.properties" >> "$GITHUB_ENV"
      - name: Build signed AAB and APK
        run: ./gradlew bundleRelease assembleRelease --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: saralsmssync-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - name: Remove key material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
