name: SMS round trip

# A real SMS on an emulator, through the real relay and back, on the oldest supported Android and recent ones.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: android-8-oldest, api: 26, target: default, gpu: swiftshader_indirect }
          - { name: android-14, api: 34, target: google_apis, gpu: swiftshader_indirect }
          - { name: android-16, api: 36, target: google_apis, gpu: swiftshader_indirect }
          - { name: android-17, api: "37.0", target: google_apis, gpu: swangle_indirect }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Round trip on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: pixel_2
          disk-size: 6000M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/round-trip.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: round-trip-${{ matrix.name }}
          path: check-output/
